<!DOCTYPE html>
<html>
    <head>
        <title>2-side pll recognition trainer</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <script type="text/javascript" src="../rubikjs/RubikjsCore.js"></script>
        <script type="text/javascript" src="../rubikjs/RubikjsRender.js"></script>
        <script type="text/javascript" src="../rubikjs/RubikjsRenderWebGL.js"></script>
        <script type="text/javascript" src="../rubikjs/RubikjsRenderCanvas.js"></script>
        <script type="text/javascript" src="../rubikjs/RubikjsNotation.js"></script>
        <script type="text/javascript" src="../rubikjs/RubikjsTwisty.js"></script>
        <script type="text/javascript" src="../rubikjs/ClassicRubiksCube.js"></script>
        <script type="text/javascript" src="pllTrainer.js"></script>
        <style>
            html {
                font-size: 16px;
            }

            #container {
                display: grid;
                grid-template-columns: 3fr 1fr; /* Dwie kolumny: kostka ma swoją szerokość, przyciski zajmują resztę */
                gap: 5px; /* Odstęp między kostką a przyciskami */
                width: 100%;
            }

            #cube {
                width: 100%;
                height: 200px;
            }

            #controls {
                width: 100%;
                display: flex;
                flex-direction: column;
                justify-content: flex-end; /* Ustawienie przycisków na dole */
                align-items: flex-start; /* Przycisków nie wyrównujemy do prawej, bo Grid automatycznie je tam umieści */
            }

            #controls button {
                font-size: 15px;
                width: 100%;
                padding: 10px 0;  /* Opcjonalnie możesz dodać trochę paddingu */
            }

            #auf button {
                font-size: 30px;
                width: 100%;
                padding: 0 0;
                font-family: 'Courier New', Courier, monospace;
                width: 33.33%; /* Każdy przycisk zajmuje 1/3 szerokości */
                box-sizing: border-box; /* Umożliwia dokładne obliczenie szerokości z paddingiem */
            }

            #solution {
                font-family: 'Courier New', Courier, monospace;
            }
            form {
                display: flex;
                justify-content: space-between; /* Rozdziela przyciski */
                width: 100%; /* Upewnia się, że form zajmuje całą szerokość */
                font-family: 'Courier New', Courier, monospace;
            }
            form.oll button {
                width: 25%;
                font-size: 10px;
            }
            button strong {
                font-size: 15px;
            }
            form#next button {
                width: 50%;
            }
            button {
                margin-right: 5px;
                margin-bottom: 5px;
            }
            #ollVisibilityForm {
                display: block; /* Ustawiamy na blokowy, aby <br> były respektowane */
                gap: 0px; /* Opcjonalnie można ustawić odstęp między elementami */
            }
            #ollVisibilityForm label {
                display: inline-block; /* Sprawia, że elementy <label> są w jednym wierszu */
                margin-right: 0px; /* Opcjonalny odstęp między checkboxami */
            }
            #ollVisibilityForm input {
                display: inline-block; /* Sprawia, że elementy <label> są w jednym wierszu */
                margin-right: 20px; /* Opcjonalny odstęp między checkboxami */
            }
        </style>
    </head>
    <body>
        <div id="container">
            <div id="cube_div">
                <canvas id="cube"></canvas>
            </div>
            <div id="controls">
                <button type="button" onclick="next()">Next</button>
                <button type="button" onclick="repeat()">Repeat</button>
            </div>
        </div>
        <form id="auf">
            <button type="button" onclick="doMoves('U\'')">&circlearrowleft;</button>
            <button type="button" onclick="doMoves('U2')" >&#128260;</button>
            <button type="button" onclick="doMoves('U')">&circlearrowright;</button>
            <button type="button" onclick="next()">Next</button>
        </form>
        <form id="P" class="oll">
            <button type="button" onclick="doOll('OLL 43','')"><strong>P</strong><br>R' U' F'</button>
            <button type="button" onclick="doOll('OLL 44','')"><strong>P</strong><br>F usexy</button>
            <button type="button" onclick="doOll('OLL 31','')"><strong>Couch</strong><br>R' U' F</button>
            <button type="button" onclick="doOll('OLL 32','')"><strong>Couch</strong><br>S sexy</button>
        </form>
        <form id="C" class="oll">
            <button type="button" onclick="doOll('OLL 46','')"><strong>C</strong><br>Easy</button>
            <button type="button" onclick="doOll('OLL 34','')"><strong>C</strong><br>Hard</button>
            <button type="button" onclick="doOll('OLL 36','')"><strong>W</strong><br>Left</button>
            <button type="button" onclick="doOll('OLL 38','')"><strong>W</strong><br>Right</button>
        </form>
        <form id="Nazi" class="oll">
            <button type="button" onclick="doOll('OLL 1','')"><strong>Runway</strong><br>R U2 R sl</button>
            <button type="button" onclick="doOll('OLL 2','')"><strong>Zamboni</strong><br>f usexy S'</button>
            <button type="button" onclick="doOll('OLL 3','')"><strong>Nazi F</strong><br>R' F2 R2</button>
            <button type="button" onclick="doOll('OLL 4','')"><strong>Nazi F'</strong><br>R' F2 R2</button>
        </form>
        <form id="Fish" class="oll">
            <button type="button" onclick="doOll('OLL 37','')"><strong>Fish</strong><br>Hedge</button>
            <button type="button" onclick="doOll('OLL 35','')"><strong>Fish</strong><br>Sledge</button>
            <button type="button" onclick="doOll('OLL 9','')"><strong>Kite</strong><br>sexy sledge</button>
            <button type="button" onclick="doOll('OLL 10','')"><strong>Kite</strong><br>RUR'U sledge</button>
        </form>
        <h1 id="solution" >&nbsp;&nbsp;</h1>
        <form id="ollVisibilityForm">
            <label for="Runway_check">Runway</label>
            <input type="checkbox" id="Runway_check" checked onchange="toggleOllVisibility('Runway', this.checked)">
            <label for="Nazi_check">Nazi</label>
            <input type="checkbox" id="Nazi_check" checked onchange="toggleOllVisibility('Nazi', this.checked)">
            <br>

            <label for="P_check">P</label>
            <input type="checkbox" id="P_check" checked onchange="toggleOllVisibility('P', this.checked)">
            <br>

            <label for="C_check">C</label>
            <input type="checkbox" id="C_check" checked onchange="toggleOllVisibility('C', this.checked)">
            <label for="W_check">W</label>
            <input type="checkbox" id="W_check" checked onchange="toggleOllVisibility('W', this.checked)">
            <br>

            <label for="Fish_check">Fish</label>
            <input type="checkbox" id="Fish_check" checked onchange="toggleOllVisibility('Fish', this.checked)">
            <label for="FishKite_check">Fish_Kite</label>
            <input type="checkbox" id="FishKite_check" checked onchange="toggleOllVisibility('Fish_Kite', this.checked)">
            <br>
        </form>
    </body>
</html>
